<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="460" height="280" fill="none">
  <!-- Laptop Display Lid & Bezel -->
  <rect x="50" y="20" width="360" height="210" rx="10" fill="#1C1F26"/>
  <rect x="52" y="22" width="356" height="206" rx="8" stroke="#444955" stroke-width="1.5"/>
  <circle cx="230" cy="28" r="2.5" fill="#5E6573"/>

  <!-- Screen Content: URL Shortener Website (Blue modern dashboard) -->
  <rect x="62" y="36" width="336" height="182" fill="#0C1B33"/>
  
  <!-- App Header -->
  <rect x="62" y="36" width="336" height="22" fill="#091426"/>
  <circle cx="74" cy="47" r="3" fill="#E84A5F"/>
  <circle cx="83" cy="47" r="3" fill="#FF847C"/>
  <circle cx="92" cy="47" r="3" fill="#99B898"/>
  <text x="110" y="51" font-family="'Inter', sans-serif" font-size="7" fill="#889BB5">swiftlink.io — Fast URL Shortener &amp; Analytics</text>

  <!-- URL Shortener Hero Area -->
  <text x="230" y="82" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">Shorten, Track &amp; Optimize Your Links</text>
  <text x="230" y="96" font-family="'Inter', sans-serif" font-size="7.5" fill="#8EAAFF" text-anchor="middle">Lightning-fast redirects with real-time geographic click tracking</text>

  <!-- Input Bar Mockup -->
  <rect x="95" y="110" width="270" height="26" rx="6" fill="#16294D" stroke="#2D5A9E" stroke-width="1"/>
  <text x="110" y="126" font-family="'Inter', sans-serif" font-size="8" fill="#6F88B3">https://yourbusiness.com/very-long-product-campaign-url...</text>
  <rect x="295" y="113" width="66" height="20" rx="4" fill="#3B82F6"/>
  <text x="328" y="126" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Shorten Link</text>

  <!-- Analytics Cards Below -->
  <g transform="translate(95, 148)">
    <rect x="0" y="0" width="80" height="48" rx="4" fill="#16294D"/>
    <text x="10" y="16" font-family="'Inter', sans-serif" font-size="6" fill="#8EAAFF">TOTAL CLICKS</text>
    <text x="10" y="36" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#60A5FA">148,290</text>
  </g>
  <g transform="translate(190, 148)">
    <rect x="0" y="0" width="80" height="48" rx="4" fill="#16294D"/>
    <text x="10" y="16" font-family="'Inter', sans-serif" font-size="6" fill="#8EAAFF">ACTIVE LINKS</text>
    <text x="10" y="36" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#34D399">1,420</text>
  </g>
  <g transform="translate(285, 148)">
    <rect x="0" y="0" width="80" height="48" rx="4" fill="#16294D"/>
    <text x="10" y="16" font-family="'Inter', sans-serif" font-size="6" fill="#8EAAFF">AVG CONVERSION</text>
    <text x="10" y="36" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#FBBF24">8.4%</text>
  </g>

  <!-- Laptop Base -->
  <path d="M15 230 L445 230 L425 244 L35 244 Z" fill="#D6D9E0"/>
  <rect x="180" y="230" width="100" height="4" rx="2" fill="#B3B8C4"/>
  <rect x="35" y="244" width="390" height="2" fill="#9CA3AF"/>
</svg>
