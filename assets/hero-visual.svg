<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" fill="none">
  <defs>
    <!-- Silk Wave Gradient -->
    <linearGradient id="silkWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBF2" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#F5E7CA" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#E8CE99" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFF9EC" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="silkWave2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EEDAA8" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#C59A3F" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="compShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#8F681C" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <filter id="cardFloatShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-6" dy="18" stdDeviation="22" flood-color="#C59A3F" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background Warm Silk Ribbon / Curved Waves -->
  <path d="M-20 180 C120 120, 240 320, 480 180 C600 110, 640 220, 720 140 L720 440 L-20 440 Z" fill="url(#silkWave)"/>
  <path d="M180 -20 C320 80, 420 30, 560 140 C640 200, 680 120, 740 180 L740 -20 Z" fill="url(#silkWave2)"/>

  <!-- ======================================================================
       1. Laptop Mockup (Background Center-Right)
       ====================================================================== -->
  <g transform="translate(195, 45)" filter="url(#compShadow)">
    <!-- Screen Lid Bezel -->
    <rect x="0" y="0" width="370" height="230" rx="14" fill="#1C1F26"/>
    <rect x="2" y="2" width="366" height="226" rx="12" stroke="#505663" stroke-width="1.6"/>
    <circle cx="185" cy="8" r="2.8" fill="#6A7282"/>

    <!-- Screen Content: Modern Websites For Growing Businesses with Lake & Mountains -->
    <g transform="translate(12, 16)">
      <rect x="0" y="0" width="346" height="202" fill="#0F172A"/>
      
      <!-- Landscape Gradient Background (Golden Hour Mountain & Lake) -->
      <linearGradient id="landscapeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0B132B"/>
        <stop offset="35%" stop-color="#1C2541"/>
        <stop offset="60%" stop-color="#474954"/>
        <stop offset="80%" stop-color="#C59A3F"/>
        <stop offset="100%" stop-color="#EEDAA8"/>
      </linearGradient>
      <rect x="0" y="0" width="346" height="150" fill="url(#landscapeGrad)"/>

      <!-- Silhouetted Mountains -->
      <polygon points="0,130 60,85 120,118 180,75 250,125 310,80 346,110 346,150 0,150" fill="#0B132B" opacity="0.85"/>
      <polygon points="40,140 110,105 170,135 240,95 300,138 346,120 346,150 0,150" fill="#060C1B"/>

      <!-- Lake Reflection -->
      <rect x="0" y="146" width="346" height="56" fill="#080F1E"/>
      <ellipse cx="173" cy="155" rx="80" ry="12" fill="#C59A3F" opacity="0.3"/>

      <!-- Website Overlay Text -->
      <text x="173" y="58" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.02em">Modern Websites For Growing Businesses</text>
      <text x="173" y="74" font-family="'Inter', sans-serif" font-size="7.5" fill="#E2E8F0" text-anchor="middle">Crafting bespoke digital experiences that convert</text>
      <rect x="136" y="86" width="74" height="18" rx="9" fill="#C59A3F"/>
      <text x="173" y="98" font-family="'Inter', sans-serif" font-size="6.8" font-weight="700" fill="#FFFFFF" text-anchor="middle">Explore Solutions</text>
    </g>

    <!-- Laptop Lower Base -->
    <path d="M-40 230 L410 230 L380 248 L-10 248 Z" fill="#D6D9E0"/>
    <rect x="145" y="230" width="80" height="5" rx="2.5" fill="#A8ADB8"/>
    <rect x="-10" y="248" width="390" height="3" fill="#888E9B"/>
  </g>

  <!-- ======================================================================
       2. Smartphone Mockup (Far Right)
       ====================================================================== -->
  <g transform="translate(520, 95)" filter="url(#compShadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="88" height="175" rx="18" fill="#1C1F26"/>
    <rect x="1.5" y="1.5" width="85" height="172" rx="16.5" stroke="#484E5B" stroke-width="1.5"/>
    
    <!-- Phone Screen -->
    <rect x="5" y="6" width="78" height="163" rx="13" fill="#FAF8F5"/>
    <!-- Speaker Notch -->
    <rect x="30" y="10" width="28" height="4" rx="2" fill="#2E333F"/>
    
    <!-- Mobile Screen UI -->
    <rect x="9" y="22" width="70" height="38" rx="6" fill="#181A20"/>
    <text x="44" y="38" font-family="'Manrope', sans-serif" font-size="5" font-weight="800" fill="#FFFFFF" text-anchor="middle">Turn Vision Into</text>
    <text x="44" y="46" font-family="'Manrope', sans-serif" font-size="5.5" font-weight="800" fill="#C59A3F" text-anchor="middle">Digital Growth</text>
    <rect x="24" y="50" width="40" height="7" rx="3.5" fill="#C59A3F"/>
    <text x="44" y="55" font-family="'Inter', sans-serif" font-size="3.8" font-weight="700" fill="#FFFFFF" text-anchor="middle">Get Started</text>

    <!-- Mobile Mini Cards -->
    <rect x="9" y="66" width="70" height="24" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>
    <circle cx="17" cy="78" r="4" fill="#FDF6E9"/>
    <text x="26" y="76" font-family="'Manrope', sans-serif" font-size="4.2" font-weight="700" fill="#1E293B">Modern UI</text>
    <text x="26" y="83" font-family="'Inter', sans-serif" font-size="3.5" fill="#64748B">Fast &amp; responsive</text>

    <rect x="9" y="94" width="70" height="24" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>
    <circle cx="17" cy="106" r="4" fill="#EBF9F1"/>
    <text x="26" y="104" font-family="'Manrope', sans-serif" font-size="4.2" font-weight="700" fill="#1E293B">WhatsApp Flow</text>
    <text x="26" y="111" font-family="'Inter', sans-serif" font-size="3.5" fill="#64748B">Instant inquiries</text>

    <rect x="9" y="122" width="70" height="24" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>
    <circle cx="17" cy="134" r="4" fill="#EFF6FF"/>
    <text x="26" y="132" font-family="'Manrope', sans-serif" font-size="4.2" font-weight="700" fill="#1E293B">SEO Optimized</text>
    <text x="26" y="139" font-family="'Inter', sans-serif" font-size="3.5" fill="#64748B">Google rankings</text>

    <!-- Bottom Home Bar -->
    <rect x="30" y="160" width="28" height="2.5" rx="1.2" fill="#94A3B8"/>
  </g>

  <!-- ======================================================================
       3. Official Framed Logo Card (Front Center-Left)
       ====================================================================== -->
  <g transform="translate(18, 50)" filter="url(#cardFloatShadow)">
    <!-- White Card with Gold Border -->
    <rect x="0" y="0" width="250" height="235" rx="20" fill="#FFFFFF"/>
    <rect x="0" y="0" width="250" height="235" rx="20" stroke="#C59A3F" stroke-width="1.8" stroke-opacity="0.85"/>

    <!-- Exact Official Logo Image -->
    <image href="logo.png" x="15" y="10" width="220" height="215" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- Small potted plant decoration in right background -->
  <g transform="translate(620, 160)" opacity="0.8">
    <ellipse cx="25" cy="55" rx="14" ry="4" fill="#D1D5DB"/>
    <!-- Pot -->
    <polygon points="12,38 38,38 34,54 16,54" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
    <!-- Foliage Leaves -->
    <path d="M25 38 C20 20, 10 12, 5 15 C0 18, 12 30, 25 38 Z" fill="#34D399"/>
    <path d="M25 38 C28 15, 38 6, 42 10 C46 15, 34 28, 25 38 Z" fill="#10B981"/>
    <path d="M25 38 C22 18, 24 5, 27 6 C30 8, 28 26, 25 38 Z" fill="#059669"/>
  </g>
</svg>
